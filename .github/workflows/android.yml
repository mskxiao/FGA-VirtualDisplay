# Build APK for the FGA VirtualDisplay prototype.
#
# No GitHub Secrets are required: the `ci` buildType uses the debug keystore,
# which is already committed at app/fgadebug.keystore (public upstream file).
name: Android CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you building manually?'
        required: false
        default: 'manual build'

# Deliberately NOT cancel-in-progress on push: a cancelled build tells us nothing
# about whether the tree compiles, and a Gradle Android build costs ~10 minutes.
# Only pull-request builds cancel their own predecessors.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"'

jobs:
  build:
    name: assembleCi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record version info
        id: ver
        shell: bash
        run: |
          SHA="${GITHUB_SHA}"
          SHORT="$(echo "$SHA" | cut -c1-7)"
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          echo "short=$SHORT" >>"$GITHUB_OUTPUT"
          echo "build_name=${SHORT}-run${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"
          {
            echo "### Build info"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| commit | \`${SHA}\` |"
            echo "| branch | \`${GITHUB_REF_NAME}\` |"
            echo "| run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show environment
        shell: bash
        run: |
          echo "java: $(java -version 2>&1 | head -1)"
          echo "gradle wrapper: $(grep distributionUrl gradle/wrapper/gradle-wrapper.properties)"
          echo "modules:"
          grep '^include' settings.gradle.kts

      # :vdisplay tests run on the JVM with no emulator, so a broken parser fails in
      # about a minute instead of after a ten-minute Android build.
      - name: Unit tests (:vdisplay)
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :vdisplay:test --stacktrace 2>&1 | tee test.log

      # Annotations and the step summary are readable over the REST API without a
      # token, while artifact downloads require auth. Keeping the real cause here
      # makes a failure diagnosable from outside the repository.
      - name: Summarise test failure
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo '::group::test.log (tail 150)'
          tail -150 test.log 2>/dev/null || echo 'no test.log'
          echo '::endgroup::'
          CAUSE=$(grep -E '^e: file|^e: |Could not (resolve|find|create)|No matching variant|Unresolved reference|error:|Caused by:|> Could not' test.log 2>/dev/null | head -25)
          {
            echo '### :vdisplay unit tests FAILED'
            echo ''
            echo '```'
            echo "${CAUSE:-no recognised error line; see the full log}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          FIRST=$(echo "$CAUSE" | head -1)
          echo "::error title=:vdisplay tests failed::${FIRST:-see test.log}"
          exit 1

      - name: Build APK (assembleCi)
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleCi --stacktrace 2>&1 | tee build.log
        env:
          FGA_VERSION_CODE: ${{ github.run_number }}
          FGA_VERSION_NAME: ${{ steps.ver.outputs.build_name }}

      - name: Summarise build failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo '::group::build.log (tail 200)'
          tail -200 build.log 2>/dev/null || echo 'no build.log'
          echo '::endgroup::'
          CAUSE=$(grep -E '^e: file|^e: |Could not (resolve|find|create)|No matching variant|Unresolved reference|error:|Caused by:|> Could not' build.log 2>/dev/null | head -40)
          {
            echo '### assembleCi FAILED'
            echo ''
            echo '```'
            echo "${CAUSE:-no recognised error line; see the full log}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          FIRST=$(echo "$CAUSE" | head -1)
          echo "::error title=assembleCi failed::${FIRST:-see build.log}"

      - name: Rename artifact
        id: artifact
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/ci -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo '::error title=APK not found::assembleCi produced no APK. Check build.log.'
            exit 1
          fi
          APK_NAME="FGA-VirtualDisplay-${{ steps.ver.outputs.build_name }}.apk"
          cp "$APK" "$APK_NAME"
          echo "apk_name=$APK_NAME" >>"$GITHUB_OUTPUT"
          ls -l "$APK_NAME"
          {
            echo "### APK"
            echo ""
            echo "- file: \`${APK_NAME}\`"
            echo "- size: $(du -h "$APK_NAME" | cut -f1)"
            echo "- sha256: \`$(sha256sum "$APK_NAME" | cut -d' ' -f1)\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FGA-VirtualDisplay-${{ steps.ver.outputs.build_name }}
          path: ${{ steps.artifact.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.ver.outputs.build_name }}
          path: |
            build.log
            test.log
          if-no-files-found: warn
          retention-days: 14
