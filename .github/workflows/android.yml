# Build APK for the FGA VirtualDisplay prototype.
#
# No GitHub Secrets are required: the `ci` buildType uses the debug keystore,
# which is already committed at app/fgadebug.keystore (public upstream file).
name: Android CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you building manually?'
        required: false
        default: 'manual build'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"'

jobs:
  build:
    name: assembleCi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record version info
        id: ver
        shell: bash
        run: |
          SHA="${GITHUB_SHA}"
          SHORT="$(echo "$SHA" | cut -c1-7)"
          echo "build_name=${SHORT}-run${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"
          {
            echo "### Build info"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| commit | \`${SHA}\` |"
            echo "| branch | \`${GITHUB_REF_NAME}\` |"
            echo "| run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show environment
        shell: bash
        run: |
          echo "java: $(java -version 2>&1 | head -1)"
          echo "gradle wrapper: $(grep distributionUrl gradle/wrapper/gradle-wrapper.properties)"
          echo "modules:"
          grep '^include' settings.gradle.kts

      # Pure-JVM tests, no emulator. Cheapest first so a broken parser or a broken quoting
      # rule fails in about a minute rather than after a ten-minute Android build.
      #
      # These steps DO decide the job's fate (no continue-on-error), which is correct: a
      # failing unit test should fail the run. The diagnosis steps below use `if: always()`
      # so the reason is always published, even on a step that failed.
      - name: Unit tests (:vdisplay)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :vdisplay:test --stacktrace 2>&1 | tee test-vdisplay.log

      - name: Unit tests (:app, probe logic)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testCiUnitTest --stacktrace 2>&1 | tee test-app.log

      - name: Diagnose test failures
        if: failure()
        shell: bash
        run: |
          for f in test-vdisplay.log test-app.log; do
            [ -f "$f" ] || continue
            if grep -qE '^> Task .*FAILED|FAILURE: Build failed' "$f"; then
              echo "::group::$f (tail 120)"
              tail -120 "$f"
              echo '::endgroup::'
              CAUSE=$(grep -E '^e: file|^e: |Could not (resolve|find|create)|No matching variant|Unresolved reference|error:|Caused by:|> Could not|^> Task .*FAILED' "$f" | head -25)
              {
                echo "### $f FAILED"
                echo ''
                echo '```'
                echo "${CAUSE:-no recognised error line}"
                echo '```'
              } >>"$GITHUB_STEP_SUMMARY"
              FIRST=$(echo "$CAUSE" | head -1)
              echo "::error title=Tests failed ($f)::${FIRST:-see $f}"
            fi
          done
          exit 1

      - name: Build APK (assembleCi)
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleCi --stacktrace 2>&1 | tee build.log
        env:
          FGA_VERSION_CODE: ${{ github.run_number }}
          FGA_VERSION_NAME: ${{ steps.ver.outputs.build_name }}

      # A Kotlin compile error is the most likely failure here, so the patterns target
      # exactly those messages and nothing vaguer.
      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          echo '::group::build.log (tail 200)'
          tail -200 build.log 2>/dev/null || echo 'no build.log'
          echo '::endgroup::'
          CAUSE=$(grep -E '^e: file|^e: |Could not (resolve|find|create)|No matching variant|Unresolved reference|error:|Caused by:|> Could not|^> Task .*FAILED|Execution failed for task' build.log 2>/dev/null | head -40)
          {
            echo '### assembleCi FAILED'
            echo ''
            echo '```'
            echo "${CAUSE:-no recognised error line; see the build-log artifact}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          FIRST=$(echo "$CAUSE" | head -1)
          echo "::error title=assembleCi failed::${FIRST:-see build.log}"
          exit 1

      - name: Rename artifact
        id: artifact
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/ci -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo '::error title=APK not found::assembleCi produced no APK.'
            exit 1
          fi
          APK_NAME="FGA-VirtualDisplay-${{ steps.ver.outputs.build_name }}.apk"
          cp "$APK" "$APK_NAME"
          echo "apk_name=$APK_NAME" >>"$GITHUB_OUTPUT"
          ls -l "$APK_NAME"
          {
            echo "### APK"
            echo ""
            echo "- file: \`${APK_NAME}\`"
            echo "- size: $(du -h "$APK_NAME" | cut -f1)"
            echo "- sha256: \`$(sha256sum "$APK_NAME" | cut -d' ' -f1)\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FGA-VirtualDisplay-${{ steps.ver.outputs.build_name }}
          path: ${{ steps.artifact.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.ver.outputs.build_name }}
          path: |
            build.log
            test-vdisplay.log
            test-app.log
          if-no-files-found: warn
          retention-days: 14
